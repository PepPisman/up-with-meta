services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dota}
      POSTGRES_DB: ${POSTGRES_DB:-dota_meta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-dota} -d ${POSTGRES_DB:-dota_meta}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
